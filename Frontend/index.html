
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Self-Checkout System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header-content">
        <h1>Smart Self-Checkout</h1>
        <p>Shop smart. Save time. Checkout easily.</p>
    </div>
</header>

<main class="container">

    <section class="products-section">
        <div class="section-heading">
            <h2>Available Products</h2>
            <p>Select products to add them to your cart.</p>
        </div>

        <div class="products">

            <div class="product-card">
                <div class="product-icon">🌾</div>
                <h3>Rice</h3>
                <p class="price">₹110</p>
                <button onclick="addToCart(1)">Add to Cart</button>
                <button class="remove-btn" onclick="removeFromCart(1)">
                    Remove One
                </button>
            </div>

            <div class="product-card">
                <div class="product-icon">🥛</div>
                <h3>Milk</h3>
                <p class="price">₹30</p>
                <button onclick="addToCart(2)">Add to Cart</button>
                <button class="remove-btn" onclick="removeFromCart(2)">
                    Remove One
                </button>
            </div>

            <div class="product-card">
                <div class="product-icon">🍞</div>
                <h3>Bread</h3>
                <p class="price">₹40</p>
                <button onclick="addToCart(3)">Add to Cart</button>
                <button class="remove-btn" onclick="removeFromCart(3)">
                    Remove One
                </button>
            </div>

        </div>
    </section>

    <section class="cart-section">
        <div class="section-heading">
            <h2>🛒 Shopping Cart</h2>
            <p>Your selected items appear here.</p>
        </div>

        <div id="cart">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-footer">
            <h3 id="total">Total: ₹0</h3>

            <button class="clear-btn" onclick="clearCart()">
                Remove All Items
            </button>
        </div>
    </section>

</main>

<footer>
    <p>Smart Self-Checkout System | Day 4 Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
