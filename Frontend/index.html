<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Self-Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Smart Self-Checkout</h1>
    <p class="subtitle">Add products to your cart</p>

    <div class="product-card">
        <h2>Rice</h2>
        <p>Price: ₹110</p>
        <button onclick="addToCart(110)">Add to Cart</button>
        <button class="remove-btn" onclick="removeFromCart(110)">Remove</button>
    </div>

    <div class="product-card">
        <h2>Milk</h2>
        <p>Price: ₹30</p>
        <button onclick="addToCart(30)">Add to Cart</button>
        <button class="remove-btn" onclick="removeFromCart(30)">Remove</button>
    </div>

    <div class="product-card">
        <h2>Bread</h2>
        <p>Price: ₹40</p>
        <button onclick="addToCart(40)">Add to Cart</button>
        <button class="remove-btn" onclick="removeFromCart(40)">Remove</button>
    </div>

    <div class="cart">
        <h2>Cart Total</h2>
        <p>Total: ₹<span id="total">0</span></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
